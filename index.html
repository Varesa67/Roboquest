<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rain Probability</title>
</head>
<body>
  <h1>Rain Probability</h1>

  <table>
    <caption>Chance of rain by time of day</caption>
    <thead>
      <tr>
        <th scope="col">Time</th>
        <th scope="col">Probability of Rain</th>
      </tr>
    </thead>
    <tbody>
      <tr data-time="04:00" data-rain-probability="20">
        <th scope="row">4:00 AM</th>
        <td>20%</td>
      </tr>
      <tr data-time="08:00" data-rain-probability="35">
        <th scope="row">8:00 AM</th>
        <td>35%</td>
      </tr>
      <tr data-time="12:00" data-rain-probability="45">
        <th scope="row">12:00 noon</th>
        <td>45%</td>
      </tr>
      <tr data-time="16:00" data-rain-probability="30">
        <th scope="row">4:00 PM</th>
        <td>30%</td>
      </tr>
      <tr data-time="20:00" data-rain-probability="15">
        <th scope="row">8:00 PM</th>
        <td>15%</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
